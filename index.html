<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluerica Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111210;--surface:#1a1917;--surface2:#222120;
  --border:#2e2c28;--accent:#c8a45a;--accent-dim:rgba(200,164,90,0.12);
  --text:#e8e2d6;--muted:#887e6d;--green:#5ea87a;--red:#c95f5f;
  --ls:#f0d9b5;--ds:#b58863;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;font-weight:400;touch-action:manipulation}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:50}
.logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--accent);letter-spacing:.02em;font-weight:700}
.logo em{font-style:italic;color:var(--muted);font-size:.85em;margin-left:8px;font-weight:400}
.hdr-right{display:flex;align-items:center;gap:12px}

.badge{font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:5px 12px;border-radius:20px;border:1px solid var(--border);color:var(--muted);letter-spacing:.08em;transition:all .3s}
.badge.go{border-color:var(--green);color:var(--green)}
.badge.wait{border-color:var(--accent);color:var(--accent)}
.badge.chk{border-color:var(--red);color:var(--red)}
.badge.calc{border-color:#e6a028;color:#e6a028;background:rgba(230,160,40,0.12)}
.badge.p2p{border-color:#5ea87a;color:#5ea87a;background:rgba(94,168,122,0.12)}

.fbtn{padding:6px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:.7rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.fbtn:hover{border-color:var(--accent);color:var(--text)}
.fbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* 3-Column Symmetrical Layout */
main{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-start;gap:18px;padding:16px 20px;max-width:1300px;margin:0 auto;width:100%}
.side-col{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.side-col.left-col{width:230px}
.side-col.right-col{width:275px}
.board-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;position:relative}

/* Board */
.pbar{display:flex;align-items:center;justify-content:space-between;width:100%;font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:500;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;gap:8px;padding:4px 6px}
.pbar-user{display:flex;align-items:center;gap:8px}
.pbar.active{color:var(--text)}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--green);display:none;flex-shrink:0}
.pbar.active .tdot{display:block}

/* Digital Chess Clocks */
.clock{display:none;font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;padding:3px 10px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);letter-spacing:.04em;transition:all .2s;min-width:68px;text-align:center}
.pbar.active .clock{background:#262420;border-color:var(--accent);color:#fff;box-shadow:0 0 10px rgba(200,164,90,0.22)}
.clock.low{border-color:var(--red)!important;color:var(--red)!important;background:rgba(201,95,95,0.18)!important;animation:lowPulse 1s infinite alternate}
@keyframes lowPulse{0%{box-shadow:0 0 4px rgba(201,95,95,0.2)}100%{box-shadow:0 0 14px rgba(201,95,95,0.6)}}

/* Time Control Grid */
.tc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

#bwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,0.5)}
#bwrap canvas.arrows{position:absolute;top:0;left:0;pointer-events:none;z-index:20}

/* Board squares */
#bwrap .board{display:grid;grid-template-columns:repeat(8,1fr);user-select:none;-webkit-user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sq.ls{background:var(--ls)}
.sq.ds{background:var(--ds)}
.sq.sel{background:rgba(255,255,255,0.22)!important;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.6)!important}
.sq.lmf{background:rgba(200,164,90,0.28)!important}
.sq.lmt{background:rgba(200,164,90,0.5)!important}
.sq.rch{background:rgba(255,170,0,0.42)!important}
.sq.pre{background:rgba(100,180,255,0.38)!important}
.sq.ehi{box-shadow:inset 0 0 0 4px rgba(100,200,100,0.9)!important}
.sq.drag-over{box-shadow:inset 0 0 0 4px rgba(255,255,255,0.85)!important}

/* Move hints */
.sq.dot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,0.24);pointer-events:none;z-index:5}
.sq.ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:5px solid rgba(0,0,0,0.22);pointer-events:none;z-index:5}

/* Coord labels */
.coord-r{position:absolute;top:3px;left:4px;font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;pointer-events:none;z-index:2}
.coord-f{position:absolute;bottom:3px;right:4px;font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;pointer-events:none;z-index:2}
.sq.ls .coord-r,.sq.ls .coord-f{color:var(--ds)}
.sq.ds .coord-r,.sq.ds .coord-f{color:var(--ls)}

/* Piece images & Dragging */
.sq img{width:88%;height:88%;pointer-events:none;position:relative;z-index:3;transition:opacity .1s ease;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;pointer-events:none;z-index:1000;transform:translate(-50%,-50%);filter:drop-shadow(0 14px 28px rgba(0,0,0,0.6));will-change:left,top;cursor:grabbing}
.drag-ghost img{width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.sq img.dragging{opacity:0.2}

/* Primary board action buttons directly under the board */
.board-actions{display:flex;gap:7px;width:100%;margin-top:8px;flex-wrap:wrap}
.board-actions .abtn{flex:1;min-width:65px;padding:10px 4px;text-align:center;font-size:.68rem}
.nbtn-sm{padding:10px 14px;background:var(--accent);color:#111;border:none;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.7rem;cursor:pointer;font-weight:600;letter-spacing:.04em;text-transform:uppercase;transition:background .15s;white-space:nowrap}
.nbtn-sm:hover{background:#d4b06a}

/* Toast reactions */
.toast-reaction{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);font-size:4rem;z-index:900;pointer-events:none;animation:popToast 1.2s ease forwards}
@keyframes popToast{0%{opacity:0;transform:translate(-50%,-50%) scale(0.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(0.8)}}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.ph{padding:9px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pb{padding:12px 14px}

/* Cat Card (Restored Full Banner) */
.cat-card{overflow:hidden}
.cat-card img{width:100%;display:block;filter:saturate(.95);border-bottom:1px solid var(--border)}
.cat-info{padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.cat-name{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--accent);font-weight:700}
.eng-row{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted)}
.edot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s}
.edot.rdy{background:var(--green)}.edot.bsy{background:var(--accent);animation:bl .7s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}

/* Eval Bar */
.eval-row{display:flex;align-items:center;gap:10px}
.eval-bar{flex:1;height:6px;background:#111;border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.eval-fill{height:100%;background:var(--ls);border-radius:3px;transition:width .6s ease;width:50%}
.eval-n{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);min-width:36px;text-align:right;font-weight:600}

/* 6-Level Difficulty Grid */
.dgrid6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.db{padding:9px 2px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.75rem;cursor:pointer;transition:all .15s;text-align:center}
.db:hover{border-color:var(--accent);color:var(--text)}
.db.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);font-weight:600}
.ds2{display:block;font-size:.58rem;margin-top:3px;opacity:.8;font-family:'Inter',sans-serif;line-height:1.25}

.crow{display:flex;gap:6px}
.cb{flex:1;padding:9px 4px;border:1px solid var(--border);background:transparent;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.7rem;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.cb:hover{border-color:var(--accent);color:var(--text)}
.cb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);font-weight:600}
.cb.wc{color:#d4c9a8}.cb.wc.on{border-color:#d4c9a8;background:rgba(212,201,168,.08);color:#e8dfc8}
.cb.bc.on{border-color:var(--text);color:var(--text);background:rgba(255,255,255,.04)}

.nbtn{width:100%;padding:10px;background:var(--accent);color:#111;border:none;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-weight:600;transition:background .15s}
.nbtn:hover{background:#d4b06a}

.arow{display:flex;gap:6px}
.abtn{padding:8px 6px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.68rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.abtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.abtn.on{border-color:#e6a028;color:#e6a028;background:rgba(230,160,40,0.12);font-weight:600}
.abtn:disabled{opacity:.25;cursor:not-allowed}
.hbtn:hover:not(:disabled){border-color:#7ec8a0;color:#7ec8a0}
.rbtn:hover:not(:disabled){border-color:var(--red);color:var(--red)}

/* Move list */
.mlist{height:220px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.78rem}
.mlist::-webkit-scrollbar{width:4px}
.mlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mrow{display:grid;grid-template-columns:30px 1fr 1fr;gap:6px;padding:4px 3px;border-bottom:1px solid rgba(255,255,255,.03)}
.mn{color:var(--border)}.mw{color:var(--text)}.mb{color:var(--muted)}
.mrow.lat .mw,.mrow.lat .mb{color:var(--accent);font-weight:600}
.emp{color:var(--border);font-size:.7rem;padding:10px 0}
.mrow.view{background:rgba(200,164,90,.08)}

/* Modal */
.ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.ov.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:32px 40px;text-align:center;max-width:300px;width:90%}
.mg{font-size:2.6rem;margin-bottom:10px}
.modal h2{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--accent);margin-bottom:8px}
.modal p{color:var(--muted);font-size:.85rem;line-height:1.6;margin-bottom:20px}

.pov{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);align-items:center;justify-content:center}
.pov.show{display:flex}
.pbox{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:20px 24px;text-align:center}
.pbox h3{font-family:'Playfair Display',serif;color:var(--accent);margin-bottom:14px;font-size:1.2rem}
.prow{display:flex;gap:8px}
.psq{width:64px;height:64px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.psq:hover{border-color:var(--accent);background:var(--accent-dim)}
.psq img{width:54px;height:54px}

/* 🎯 FOCUS MODE: Ultra-Clean Board Centered */
body.focus-mode header{background:transparent;border-bottom-color:transparent}
body.focus-mode .side-col{display:none!important}
body.focus-mode main{padding:8px;justify-content:center;align-items:center;min-height:calc(100vh - 75px)}
body.focus-mode .board-col{max-width:100%}
body.focus-mode .board-actions{max-width:640px}

/* Responsive */
@media(max-width:768px){
  main{flex-direction:column;align-items:center;padding:10px 8px;gap:14px}
  .side-col{width:100%!important;max-width:480px}
  .board-actions .abtn{font-size:.62rem;padding:8px 3px}
}
</style>
</head>
<body>
<header>
  <div class="logo">BLUERICA <em>chess</em></div>
  <div class="hdr-right">
    <button class="fbtn" id="btn-focus">🎯 Focus Mode</button>
    <div class="badge" id="badge">loading…</div>
  </div>
</header>
<main id="main-container">

  <!-- LEFT COLUMN: Settings & Game Options -->
  <aside class="side-col left-col" id="col-left">
    <!-- Game Mode (Bot vs Friend) -->
    <div class="panel">
      <div class="ph">Game Mode</div>
      <div class="pb"><div class="crow">
        <button class="cb on" id="m-bot">🤖 vs Bot</button>
        <button class="cb"    id="m-p2p">👥 vs Friend</button>
      </div></div>
    </div>

    <!-- 6 Levels of Difficulty -->
    <div class="panel" id="panel-difficulty">
      <div class="ph">Bot Difficulty</div>
      <div class="pb"><div class="dgrid6">
        <button class="db"    data-lvl="1">1<span class="ds2">Newbie<br>500</span></button>
        <button class="db on" data-lvl="2">2<span class="ds2">Beginner<br>800</span></button>
        <button class="db"    data-lvl="3">3<span class="ds2">Easy<br>1100</span></button>
        <button class="db"    data-lvl="4">4<span class="ds2">Medium<br>1500</span></button>
        <button class="db"    data-lvl="5">5<span class="ds2">Hard<br>1900</span></button>
        <button class="db"    data-lvl="6">6<span class="ds2">Master<br>2400+</span></button>
      </div></div>
    </div>

    <!-- Time Control Selector -->
    <div class="panel" id="panel-time">
      <div class="ph">Time Control</div>
      <div class="pb">
        <div class="tc-grid">
          <button class="cb on" data-tc="none">∞ None</button>
          <button class="cb"    data-tc="300">⚡ 5 min</button>
          <button class="cb"    data-tc="600">⏱ 10 min</button>
          <button class="cb"    data-tc="900">⌛ 15 min</button>
          <button class="cb"    data-tc="604800" style="grid-column: span 2">📅 7 days</button>
        </div>
      </div>
    </div>

    <!-- Play as White / Black -->
    <div class="panel" id="panel-playas">
      <div class="ph">Play As</div>
      <div class="pb"><div class="crow">
        <button class="cb wc on" id="bw">⬜ White</button>
        <button class="cb bc"    id="bb">⬛ Black</button>
      </div></div>
    </div>

    <!-- Piece Style Selector -->
    <div class="panel">
      <div class="ph">Piece Style</div>
      <div class="pb"><div class="crow">
        <button class="cb on" id="t-classic">♟ Classic</button>
        <button class="cb"    id="t-cburnett">♚ Modern</button>
      </div></div>
    </div>

    <!-- Board Color Theme (Wood / Dark / Green) -->
    <div class="panel">
      <div class="ph">Board Theme</div>
      <div class="pb"><div class="crow">
        <button class="cb on" id="btheme-wood">🪵 Wood</button>
        <button class="cb"    id="btheme-dark">🌑 Dark</button>
        <button class="cb"    id="btheme-green">🌿 Green</button>
      </div></div>
    </div>
  </aside>

  <!-- CENTER COLUMN: Grand Chessboard & Primary Controls -->
  <section class="board-col" id="col-board">
    <div class="pbar" id="top-bar">
      <div class="pbar-user"><span class="tdot"></span><span id="top-name">BLUERICA</span></div>
      <div class="clock" id="top-clock">10:00</div>
    </div>
    <div id="bwrap">
      <div class="board" id="board"></div>
      <canvas class="arrows" id="acanvas"></canvas>
    </div>
    <div class="pbar active" id="bot-bar">
      <div class="pbar-user"><span class="tdot"></span><span id="bot-name">You</span></div>
      <div class="clock" id="bot-clock">10:00</div>
    </div>

    <!-- Action buttons directly below the board -->
    <div class="board-actions">
      <button class="abtn" id="bbk" title="Previous move">◀ Back</button>
      <button class="abtn" id="bfw" title="Next move">Forward ▶</button>
      <button class="abtn" id="bcalc" title="Free play analysis mode for both sides">🧠 Analysis</button>
      <button class="abtn hbtn" id="bhint" title="Move suggestion">💡 Hint</button>
      <button class="abtn rbtn" id="bres" title="Resign game">🏳 Resign</button>
      <button class="nbtn-sm" id="ngame" title="New Game">🔄 New Game</button>
    </div>
  </section>

  <!-- RIGHT COLUMN: Bluerica Cat Banner, Evaluation, P2P Room & Move History -->
  <aside class="side-col right-col" id="col-right">
    <!-- Bluerica Cat Profile Card (Soul of the App on the RIGHT!) -->
    <div class="panel cat-card">
      <img src="cat.jpg" alt="Bluerica">
      <div class="cat-info">
        <div class="cat-name">BLUERICA</div>
        <div class="eng-row"><div class="edot" id="edot"></div><span id="elabel">Loading…</span></div>
      </div>
    </div>

    <!-- Live Eval Bar -->
    <div class="panel">
      <div class="ph">Position Eval</div>
      <div class="pb" style="padding:10px 14px">
        <div class="eval-row">
          <div class="eval-bar"><div class="eval-fill" id="efill"></div></div>
          <div class="eval-n" id="enum">0.0</div>
        </div>
      </div>
    </div>

    <!-- P2P Room Panel (Multiplayer) -->
    <div class="panel" id="p2p-panel" style="display:none">
      <div class="ph">Play vs Friend (P2P)</div>
      <div class="pb" style="display:flex;flex-direction:column;gap:8px">
        <div id="p2p-idle">
          <button class="nbtn" id="p2p-create" style="background:#5ea87a;margin-bottom:8px">🟢 Create Room</button>
          <div style="display:flex;gap:4px">
            <input type="text" id="p2p-code-in" placeholder="Room code…" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:7px 8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.7rem">
            <button class="abtn" id="p2p-join" style="padding:7px 12px">Join</button>
          </div>
        </div>
        <div id="p2p-active" style="display:none;flex-direction:column;gap:8px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted)">Room Code: <strong id="p2p-code-display" style="color:var(--accent);font-size:.82rem"></strong></div>
          <div id="p2p-status-badge" style="font-size:.68rem;color:var(--accent);font-family:'JetBrains Mono',monospace">⏳ Waiting for friend…</div>
          <button class="abtn" id="p2p-copy-btn">📋 Copy Invite Link</button>
          <a id="p2p-wa-btn" target="_blank" class="abtn" style="text-align:center;text-decoration:none;display:block;border-color:#25d366;color:#25d366">💬 Share on WhatsApp</a>
          <div class="crow" id="p2p-reactions" style="display:none;margin-top:4px">
            <button class="abtn p2p-reac" data-emo="👏">👏</button>
            <button class="abtn p2p-reac" data-emo="🤝">🤝</button>
            <button class="abtn p2p-reac" data-emo="😮">😮</button>
            <button class="abtn p2p-reac" data-emo="🔥">🔥</button>
            <button class="abtn p2p-reac" data-emo="❤️">❤️</button>
          </div>
          <button class="abtn rbtn" id="p2p-leave" style="margin-top:4px">❌ Leave Room</button>
        </div>
      </div>
    </div>

    <!-- Move History List -->
    <div class="panel" style="display:flex;flex-direction:column">
      <div class="ph">Move History</div>
      <div class="pb" style="padding:8px 12px">
        <div class="mlist" id="mlist"><div class="emp">— no moves yet —</div></div>
      </div>
    </div>
  </aside>

</main>

<div class="ov" id="ov"><div class="modal">
  <div class="mg" id="mg">♟</div>
  <h2 id="mt">Game Over</h2>
  <p id="mm"></p>
  <button class="nbtn" id="mnew" style="max-width:180px;margin:0 auto">Play Again</button>
</div></div>

<div class="pov" id="pov"><div class="pbox">
  <h3>Promote pawn</h3>
  <div class="prow" id="prow"></div>
</div></div>

<script>
const G = id => document.getElementById(id);

// ── Piece Themes ─────────────────────────────────────────────────────────────
let currentPieceTheme = localStorage.getItem('bl_theme') || 'classic';

function getPieceUrl(color, type){
  if(currentPieceTheme === 'classic'){
    return 'pieces/classic/' + color + type.toLowerCase() + '.png';
  }
  return 'pieces/cburnett/' + color + type.toUpperCase() + '.svg';
}

function updateThemeUI(){
  if(currentPieceTheme === 'classic'){
    G('t-classic').classList.add('on');
    G('t-cburnett').classList.remove('on');
  } else {
    G('t-cburnett').classList.add('on');
    G('t-classic').classList.remove('on');
  }
}

// ── Board Color Themes (Wood / Dark / Green) ──────────────────────────────────
const BOARD_THEMES = {
  wood:  { ls: '#f0d9b5', ds: '#b58863' },
  dark:  { ls: '#848079', ds: '#44413d' },
  green: { ls: '#eeeed2', ds: '#769656' }
};

let currentBoardTheme = localStorage.getItem('bl_btheme') || 'wood';

function applyBoardTheme(themeName){
  currentBoardTheme = themeName;
  localStorage.setItem('bl_btheme', themeName);
  const t = BOARD_THEMES[themeName] || BOARD_THEMES.wood;
  document.documentElement.style.setProperty('--ls', t.ls);
  document.documentElement.style.setProperty('--ds', t.ds);

  ['wood','dark','green'].forEach(name => {
    const btn = G('btheme-' + name);
    if(btn) btn.classList.toggle('on', name === themeName);
  });
}

// ── 6 Calibrated Difficulty Levels (Human Bot Deliberation Speed) ────────────
const LEVEL_CONFIG = {
  1: { dp: 1,  dl: 2200, blunderRate: 0.45, label: 'Newbie (500 Elo)' },
  2: { dp: 1,  dl: 1900, blunderRate: 0.25, label: 'Beginner (800 Elo)' },
  3: { dp: 2,  dl: 1700, blunderRate: 0.10, label: 'Easy (1100 Elo)' },
  4: { dp: 4,  dl: 1500, blunderRate: 0.00, label: 'Medium (1500 Elo)' },
  5: { dp: 8,  dl: 1300, blunderRate: 0.00, label: 'Hard (1900 Elo)' },
  6: { dp: 16, dl: 1100, blunderRate: 0.00, label: 'Master (2400+ Elo)' }
};

let currentLevel = parseInt(localStorage.getItem('bl_lvl') || '2');
if(currentLevel < 1 || currentLevel > 6) currentLevel = 2;

// ── Game State ───────────────────────────────────────────────────────────────
let gameMode = 'bot';                // 'bot' sau 'p2p'
let chess = new Chess();
let playerColor = 'w';
let sqSize = 0;
let engineReady = false, engineBusy = false;
let sf = null, sfResolve = null;
let snap = [], vi = -1;              // history snapshot, view index
let selSq = null, legal = [];        // selected square, legal targets
let ppFrom = null, ppTo = null;      // pending promotion
let pmFrom = null, pmTo = null;      // premove
let rcFrom = null, rcCurrent = null; // right-click
let isRightClicking = false;
let rcHL = {}, arrows = [];
let viewOnlyMode = false;            // true when browsing history
let analysisMode = false;            // true in Mod Calcul (free play for both sides)
let focusMode = localStorage.getItem('bl_focus') === '1';

// ── Time Control & Chess Clocks ──────────────────────────────────────────────
let selectedTC = localStorage.getItem('bl_tc') || 'none'; // 'none', '300', '600', '900', '604800'
let whiteTime = 0, blackTime = 0;
let clockTimer = null;

function formatClock(sec){
  if(sec <= 0) return '00:00';
  if(sec >= 86400){
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return `${d}d ${h}h ${m}m`;
  }
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function updateClockDisplays(){
  if(selectedTC === 'none') return;
  const isWhiteBottom = (playerColor === 'w');
  const topSec = isWhiteBottom ? blackTime : whiteTime;
  const botSec = isWhiteBottom ? whiteTime : blackTime;

  const topEl = G('top-clock');
  const botEl = G('bot-clock');
  if(!topEl || !botEl) return;

  topEl.textContent = formatClock(topSec);
  botEl.textContent = formatClock(botSec);

  const lowThreshold = (selectedTC === '604800') ? 86400 : 30;
  topEl.classList.toggle('low', topSec <= lowThreshold && topSec > 0);
  botEl.classList.toggle('low', botSec <= lowThreshold && botSec > 0);
}

function startClockIfNeeded(){
  if(selectedTC === 'none' || chess.game_over()) return;
  if(!clockTimer){
    clockTimer = setInterval(tickClock, 1000);
  }
}

function stopClock(){
  if(clockTimer){
    clearInterval(clockTimer);
    clockTimer = null;
  }
}

function tickClock(){
  if(chess.game_over()){ stopClock(); return; }
  if(analysisMode) return;

  if(chess.turn() === 'w'){
    whiteTime--;
    if(whiteTime <= 0){
      whiteTime = 0;
      handleTimeout('w');
    }
  } else {
    blackTime--;
    if(blackTime <= 0){
      blackTime = 0;
      handleTimeout('b');
    }
  }
  updateClockDisplays();
}

function handleTimeout(loserColor){
  stopClock();
  snd('GenericNotify');
  setBadge('time out!','chk');

  let title = 'Time Out!';
  let msg = '';
  let icon = '⏱';

  if(gameMode === 'bot'){
    if(loserColor === playerColor){
      icon = '😿';
      title = 'Time Out!';
      msg = 'You ran out of time. BLUERICA wins. 😼';
    } else {
      icon = '🏆';
      title = 'You win!';
      msg = 'BLUERICA ran out of time! 😺';
    }
  } else if(gameMode === 'p2p'){
    if(loserColor === playerColor){
      icon = '😿';
      title = 'Time Out!';
      msg = 'You ran out of time.';
      if(p2pConn && p2pConn.open){
        p2pConn.send({ type: 'timeout', loser: playerColor });
      }
    } else {
      icon = '🏆';
      title = 'You win!';
      msg = 'Your friend ran out of time!';
    }
  }

  G('mg').textContent = icon;
  G('mt').textContent = title;
  G('mm').textContent = msg;
  G('mnew').textContent = gameMode === 'p2p' ? 'Request Rematch' : 'Play Again';
  G('ov').classList.add('show');
}

// Drag & drop state
let dragCandidate = null;
let isDragging = false;
let startPos = { x: 0, y: 0 };
let ghost = null;
let currentHoverSq = null;
let lastFrom = null, lastTo = null;

// P2P State
let peer = null;
let p2pConn = null;
let isHost = false;
let p2pRoomId = null;

// ── Sounds ────────────────────────────────────────────────────────────────────
const SND = {};
['Move','Capture','Select','GenericNotify'].forEach(n => {
  const a = new Audio('sounds/'+n+'.mp3'); a.preload='auto'; SND[n]=a;
});
function snd(n){const s=SND[n];if(!s)return;const c=s.cloneNode();c.volume=.7;c.play().catch(()=>{})}
const AC=window.AudioContext||window.webkitAudioContext; let ac=null;
function sndCheck(){
  if(!ac)ac=new AC(); if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime;
  [0,.12,.24].forEach((o,i)=>{
    const os=ac.createOscillator(),g=ac.createGain();
    os.connect(g);g.connect(ac.destination);
    os.type='sine';os.frequency.setValueAtTime(880-i*60,t+o);
    g.gain.setValueAtTime(.14,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+.1);
    os.start(t+o);os.stop(t+o+.1);
  });
}

// ── Engine ────────────────────────────────────────────────────────────────────
function initEngine(){
  try{
    const b=new Blob([`importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');`],{type:'application/javascript'});
    sf=new Worker(URL.createObjectURL(b));
    sf.onmessage=e=>{
      const m=e.data;
      if(m==='uciok'){sf.postMessage('isready');return}
      if(m==='readyok'){
        engineReady=true;G('edot').className='edot rdy';G('elabel').textContent='BLUERICA ready';
        if(gameMode==='bot') setBadge('your move','go');
        return;
      }
      if(m&&m.startsWith('bestmove')&&sfResolve){
        const mv=m.split(' ')[1],cb=sfResolve;sfResolve=null;cb(mv==='(none)'?null:mv);return;
      }
      if(m&&m.includes('score cp')){const r=m.match(/score cp (-?\d+)/);if(r)setEval(parseInt(r[1])/100)}
      if(m&&m.includes('score mate')){const r=m.match(/score mate (-?\d+)/);if(r)setEval(parseInt(r[1])>0?99:-99)}
    };
    sf.onerror=()=>G('elabel').textContent='Engine error';
    sf.postMessage('uci');
  }catch(e){G('elabel').textContent='Engine unavailable'}
}

function setEval(cp){
  const p=Math.min(Math.max(50+cp*3.5,4),96);
  G('efill').style.width=p+'%';
  G('enum').textContent=cp>=99?'+M':cp<=-99?'-M':(cp>=0?'+':'')+cp.toFixed(1);
}

async function bestMove(fen, dp){
  return new Promise(r=>{
    sfResolve=r;
    sf.postMessage('position fen '+fen);
    sf.postMessage('go depth '+(dp || 1));
  });
}

function chooseEngineMove(legalMoves, bestMoveUci, blunderRate){
  if(!bestMoveUci || !legalMoves.length) return bestMoveUci;
  if(!blunderRate || blunderRate <= 0 || legalMoves.length <= 1) return bestMoveUci;

  if(Math.random() < blunderRate){
    const bestUci = bestMoveUci.slice(0, 4);
    const candidateMoves = legalMoves.filter(m => (m.from + m.to) !== bestUci);
    if(candidateMoves.length > 0){
      const picked = candidateMoves[Math.floor(Math.random() * candidateMoves.length)];
      return picked.from + picked.to + (picked.promotion || 'q');
    }
  }
  return bestMoveUci;
}

// ── Board Rendering (Enlarged & Crisp) ────────────────────────────────────────
function boardPx(){
  if(document.body.classList.contains('focus-mode')){
    const max = Math.min(window.innerWidth - 32, window.innerHeight - 150, 720);
    return Math.max(Math.floor(max / 8) * 8, 280);
  }
  if(window.innerWidth <= 768){
    const max = Math.min(window.innerWidth - 20, window.innerHeight - 250, 480);
    return Math.max(Math.floor(max / 8) * 8, 280);
  }
  // Available width between the two sidebars (230px left + 275px right + 36px gaps + 40px padding = 581px)
  const availW = window.innerWidth - 581;
  const max = Math.min(availW, window.innerHeight - 170, 620);
  return Math.max(Math.floor(max / 8) * 8, 360);
}

function renderBoard(pos){
  const brd=G('board');
  const flip=playerColor==='b';
  const sz=boardPx(); sqSize=sz/8;
  brd.style.width=sz+'px'; brd.style.height=sz+'px';
  brd.innerHTML='';

  const fenObj = pos ? new Chess(typeof pos==='string'?pos:pos.fen()) : chess;

  for(let ri=0;ri<8;ri++){
    for(let ci=0;ci<8;ci++){
      const row=flip?ri:7-ri, col=flip?7-ci:ci;
      const sq='abcdefgh'[col]+(row+1);
      const light=(row+col)%2===1;
      const div=document.createElement('div');
      div.className='sq '+(light?'ls':'ds');
      div.dataset.sq=sq;
      div.style.width=sqSize+'px'; div.style.height=sqSize+'px';

      // coords
      if(ci===0){const r=document.createElement('span');r.className='coord-r';r.textContent=row+1;div.appendChild(r)}
      if(ri===7){const f=document.createElement('span');f.className='coord-f';f.textContent='abcdefgh'[col];div.appendChild(f)}

      // piece
      const p=fenObj.get(sq);
      if(p){
        const img=document.createElement('img');
        img.src=getPieceUrl(p.color, p.type);
        img.draggable=false;
        div.appendChild(img);
      }

      div.addEventListener('mousedown',e=>onPointerDown(e,sq,false));
      div.addEventListener('touchstart',e=>onPointerDown(e,sq,true),{passive:false});
      brd.appendChild(div);
    }
  }

  // sync canvas
  const cv=G('acanvas');
  cv.width=sz; cv.height=sz;
  cv.style.width=sz+'px'; cv.style.height=sz+'px';

  applySquareClasses();
  drawArrows();
}

function getSqEl(sq){return G('board').querySelector('[data-sq="'+sq+'"]')}

function applySquareClasses(){
  G('board').querySelectorAll('.sq').forEach(el=>{
    el.classList.remove('sel','lmf','lmt','rch','pre','ehi','dot','ring','drag-over');
  });
  if(selSq) getSqEl(selSq)?.classList.add('sel');
  legal.forEach(t=>{
    const el=getSqEl(t); if(!el) return;
    el.classList.add(chess.get(t)?'ring':'dot');
  });
  if(lastFrom) getSqEl(lastFrom)?.classList.add('lmf');
  if(lastTo)   getSqEl(lastTo)?.classList.add('lmt');
  Object.keys(rcHL).forEach(sq=>getSqEl(sq)?.classList.add('rch'));
  if(pmFrom){getSqEl(pmFrom)?.classList.add('pre');getSqEl(pmTo)?.classList.add('pre')}
}

// ── Piece Interaction (Smooth Drag-and-Drop & Click-to-Move) ───────────────────
function isAllowedToMove(piece){
  if(analysisMode) return piece && piece.color === chess.turn();
  if(gameMode === 'p2p') return piece && piece.color === playerColor && chess.turn() === playerColor;
  return piece && piece.color === playerColor && chess.turn() === playerColor && !engineBusy;
}

function onPointerDown(e, sq, isTouch){
  // Right-click handling: capture immediately with the clicked square
  if(!isTouch && e.button === 2){
    e.preventDefault();
    isRightClicking = true;
    rcFrom = sq;
    rcCurrent = sq;
    return;
  }

  // Prevent native browser dragging & selection on desktop and touch
  e.preventDefault();

  // Chess.com behavior: ANY left click anywhere on the board clears arrows and highlights!
  if(!isTouch && e.button === 0){
    if(arrows.length > 0 || Object.keys(rcHL).length > 0){
      clearArrowsHL();
    }
  }

  const clientX = isTouch ? e.touches[0].clientX : e.clientX;
  const clientY = isTouch ? e.touches[0].clientY : e.clientY;

  if(chess.game_over()) return;
  if(viewOnlyMode){ returnToLive(); return; }

  // Premove / wait in bot mode
  if(gameMode === 'bot' && !analysisMode && (engineBusy || chess.turn() !== playerColor)){
    const p = chess.get(sq);
    if(selSq){
      const sp = chess.get(selSq);
      if(sp && sp.color === playerColor){
        setPremove(selSq, sq); clearSel(); return;
      }
    }
    if(p && p.color === playerColor){
      selSq = sq; legal = []; applySquareClasses();
    }
    return;
  }

  // If already selected
  if(selSq){
    if(sq === selSq){ clearSel(); return; }
    if(legal.includes(sq)){ doMove(selSq, sq); return; }
    const p = chess.get(sq);
    if(isAllowedToMove(p)){
      selSq = sq;
      legal = chess.moves({square: sq, verbose: true}).map(m => m.to);
      applySquareClasses();
      startDragCandidate(clientX, clientY, sq, p);
      return;
    }
    clearSel();
    if(Object.keys(rcHL).length > 0 || arrows.length > 0) clearArrowsHL();
    return;
  }

  const p = chess.get(sq);
  if(isAllowedToMove(p)){
    selSq = sq;
    legal = chess.moves({square: sq, verbose: true}).map(m => m.to);
    applySquareClasses();
    startDragCandidate(clientX, clientY, sq, p);
  } else {
    if(Object.keys(rcHL).length > 0 || arrows.length > 0) clearArrowsHL();
  }
}

function startDragCandidate(cx, cy, sq, piece){
  dragCandidate = { sq, piece };
  isDragging = false;
  startPos = { x: cx, y: cy };
  currentHoverSq = null;
}

function handlePointerMove(cx, cy){
  if(!dragCandidate) return;

  if(!isDragging){
    const dist = Math.hypot(cx - startPos.x, cy - startPos.y);
    if(dist > 4){
      isDragging = true;
      const pieceEl = getSqEl(dragCandidate.sq)?.querySelector('img');
      if(pieceEl) pieceEl.classList.add('dragging');

      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.style.width = sqSize + 'px';
      ghost.style.height = sqSize + 'px';
      ghost.innerHTML = '<img src="' + getPieceUrl(dragCandidate.piece.color, dragCandidate.piece.type) + '" draggable="false">';
      ghost.style.left = cx + 'px';
      ghost.style.top = cy + 'px';
      document.body.appendChild(ghost);
    }
  }

  if(isDragging && ghost){
    ghost.style.left = cx + 'px';
    ghost.style.top = cy + 'px';

    const hoverSq = sqFromXY(cx, cy);
    if(hoverSq !== currentHoverSq){
      if(currentHoverSq) getSqEl(currentHoverSq)?.classList.remove('drag-over');
      if(hoverSq && legal.includes(hoverSq)){
        getSqEl(hoverSq)?.classList.add('drag-over');
      }
      currentHoverSq = hoverSq;
    }
  }
}

function handlePointerUp(cx, cy){
  if(!dragCandidate) return;

  if(isDragging){
    if(ghost){ ghost.remove(); ghost = null; }
    getSqEl(dragCandidate.sq)?.querySelector('img')?.classList.remove('dragging');
    if(currentHoverSq){
      getSqEl(currentHoverSq)?.classList.remove('drag-over');
      currentHoverSq = null;
    }

    const dropSq = sqFromXY(cx, cy);
    if(dropSq && dropSq !== dragCandidate.sq && legal.includes(dropSq)){
      doMove(dragCandidate.sq, dropSq);
    } else {
      applySquareClasses();
    }
  }

  dragCandidate = null;
  isDragging = false;
}

document.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
document.addEventListener('mouseup', e => { if(e.button !== 2) handlePointerUp(e.clientX, e.clientY); });
document.addEventListener('touchmove', e => {
  if(dragCandidate){
    e.preventDefault();
    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }
}, {passive:false});
document.addEventListener('touchend', e => {
  if(dragCandidate){
    const t = e.changedTouches[0];
    handlePointerUp(t.clientX, t.clientY);
  }
});

function clearSel(){selSq=null;legal=[];applySquareClasses()}

function doMove(from,to,promo){
  const p=chess.get(from);
  if(p&&p.type==='p'){
    const r=to[1];
    const isPromoRow = (p.color==='w'&&r==='8')||(p.color==='b'&&r==='1');
    if(isPromoRow){
      ppFrom=from;ppTo=to;clearSel();showPromo();return;
    }
  }
  const mv=chess.move({from,to,promotion:promo||'q'});
  if(!mv){clearSel();return}
  lastFrom=from;lastTo=to;
  clearSel();
  clearArrowsHL();
  renderBoard();
  snd(mv.flags&&(mv.flags.includes('c')||mv.flags.includes('e'))?'Capture':'Move');
  if(chess.in_check())sndCheck();
  updateStatus();updateMoves();
  startClockIfNeeded();

  if(gameMode === 'p2p' && p2pConn && p2pConn.open){
    p2pConn.send({ type: 'move', from, to, promo: promo || 'q' });
  }

  if(chess.game_over()){snd('GenericNotify');setTimeout(showOver,500);return}

  if(gameMode === 'bot'){
    if(analysisMode){
      bestMove(chess.fen(), 2);
    } else {
      engineGo();
    }
  }
}

function doRemoteMove(from, to, promo){
  const mv=chess.move({from, to, promotion: promo || 'q'});
  if(!mv) return;
  lastFrom = from; lastTo = to;
  clearArrowsHL();
  renderBoard();
  snd(mv.flags && (mv.flags.includes('c') || mv.flags.includes('e')) ? 'Capture' : 'Move');
  if(chess.in_check()) sndCheck();
  updateStatus(); updateMoves();
  if(chess.game_over()){ snd('GenericNotify'); setTimeout(showOver, 500); }
}

function sqFromXY(x,y){
  const el = document.elementFromPoint(x, y);
  if(el){
    const sqEl = el.closest('.sq');
    if(sqEl && sqEl.dataset.sq) return sqEl.dataset.sq;
  }
  const brd=G('board').getBoundingClientRect();
  const px=x-brd.left, py=y-brd.top;
  const sz=brd.width/8;
  const col=Math.floor(px/sz), row=Math.floor(py/sz);
  if(col<0||col>7||row<0||row>7) return null;
  const flip=playerColor==='b';
  return 'abcdefgh'[flip?7-col:col]+(flip?row+1:8-row);
}

// ── Bot Turn (Calm, Realistic Thinking Delays) ────────────────────────────────
async function engineGo(){
  if(!engineReady || analysisMode || gameMode === 'p2p') return;
  engineBusy=true;
  setBadge('thinking…','wait'); G('edot').className='edot bsy';

  const cfg = LEVEL_CONFIG[currentLevel] || LEVEL_CONFIG[2];
  const best = await bestMove(chess.fen(), cfg.dp);

  const legalMoves = chess.moves({ verbose: true });
  const actualMoveStr = chooseEngineMove(legalMoves, best, cfg.blunderRate);

  // Human thinking delay: calm and realistic
  const thinkTime = cfg.dl + Math.random() * 500;
  await new Promise(r=>setTimeout(r, thinkTime));
  engineBusy=false; G('edot').className='edot rdy';
  if(!actualMoveStr) return;

  const from=actualMoveStr.slice(0,2), to=actualMoveStr.slice(2,4);
  const mv=chess.move({from, to, promotion: actualMoveStr[4]||'q'});
  lastFrom=from; lastTo=to;
  clearArrowsHL();
  renderBoard();
  snd(mv&&mv.flags&&(mv.flags.includes('c')||mv.flags.includes('e'))?'Capture':'Move');
  if(chess.in_check())sndCheck();
  updateStatus();updateMoves();
  startClockIfNeeded();
  if(chess.game_over()){snd('GenericNotify');setTimeout(showOver,500);return}

  if(pmFrom){
    const pf=pmFrom,pt=pmTo; clearPremove();
    setTimeout(()=>{
      if(chess.turn()===playerColor&&!chess.game_over()) doMove(pf,pt);
    },80);
  }
}

// ── Premove ───────────────────────────────────────────────────────────────────
function setPremove(from,to){
  clearPremove(); pmFrom=from; pmTo=to;
  applySquareClasses();
  setBadge('premove set','wait');
}
function clearPremove(){pmFrom=null;pmTo=null;applySquareClasses()}

// ── Right-click Arrows & Highlights (Exact Chess.com Behavior) ────────────────
document.addEventListener('contextmenu', e => {
  if (e.target.closest('#bwrap') || e.target.closest('#board')) {
    e.preventDefault();
  }
}, { capture: true });

document.addEventListener('mousemove', e => {
  if (!isRightClicking || !rcFrom) return;
  if (!(e.buttons & 2)) {
    isRightClicking = false;
    rcFrom = null;
    rcCurrent = null;
    drawArrows();
    return;
  }
  const sq = sqFromXY(e.clientX, e.clientY);
  if (sq && sq !== rcCurrent) {
    rcCurrent = sq;
    drawArrows(rcCurrent);
  }
});

document.addEventListener('mouseup', e => {
  if (e.button !== 2 || !isRightClicking || !rcFrom) return;
  e.preventDefault();
  const sq = sqFromXY(e.clientX, e.clientY);
  if (sq && sq !== rcFrom) {
    // Arrow from rcFrom to sq: toggle if already exists
    const idx = arrows.findIndex(a => a.f === rcFrom && a.t === sq);
    if (idx !== -1) arrows.splice(idx, 1);
    else arrows.push({ f: rcFrom, t: sq });
  } else if (rcFrom) {
    // Single square click: toggle orange highlight
    if (rcHL[rcFrom]) {
      delete rcHL[rcFrom];
      getSqEl(rcFrom)?.classList.remove('rch');
    } else {
      rcHL[rcFrom] = true;
      getSqEl(rcFrom)?.classList.add('rch');
    }
  }
  isRightClicking = false;
  rcFrom = null;
  rcCurrent = null;
  drawArrows();
});

function clearArrowsHL(){
  Object.keys(rcHL).forEach(sq => getSqEl(sq)?.classList.remove('rch'));
  rcHL = {};
  arrows = [];
  drawArrows();
}

function getSqCenter(sq){
  const el = getSqEl(sq);
  if (!el) return null;
  const bRect = G('board').getBoundingClientRect();
  const sRect = el.getBoundingClientRect();
  return {
    x: sRect.left - bRect.left + sRect.width / 2,
    y: sRect.top - bRect.top + sRect.height / 2
  };
}

function drawArrows(previewTo = null){
  const cv = G('acanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  const sz = sqSize;
  if (!sz) return;

  const renderArrow = (f, t, isPreview = false) => {
    const fc = getSqCenter(f);
    const tc = getSqCenter(t);
    if (!fc || !tc) return;

    const dx = tc.x - fc.x;
    const dy = tc.y - fc.y;
    const len = Math.hypot(dx, dy);
    if (len < 5) return;

    const angle = Math.atan2(dy, dx);
    const color = isPreview ? 'rgba(255, 170, 0, 0.65)' : 'rgba(255, 165, 0, 0.88)';
    const shaftWidth = sz * 0.17;
    const headLength = sz * 0.38;

    const tipOffset = sz * 0.16;
    const tipX = tc.x - Math.cos(angle) * tipOffset;
    const tipY = tc.y - Math.sin(angle) * tipOffset;

    const startX = fc.x + Math.cos(angle) * (sz * 0.14);
    const startY = fc.y + Math.sin(angle) * (sz * 0.14);

    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = shaftWidth;
    ctx.lineCap = 'round';

    // Shaft
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(tipX - Math.cos(angle) * (headLength * 0.65), tipY - Math.sin(angle) * (headLength * 0.65));
    ctx.stroke();

    // Triangle Head (with Chess.com indented back)
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(
      tipX - headLength * Math.cos(angle - 0.52),
      tipY - headLength * Math.sin(angle - 0.52)
    );
    ctx.lineTo(
      tipX - (headLength * 0.72) * Math.cos(angle),
      tipY - (headLength * 0.72) * Math.sin(angle)
    );
    ctx.lineTo(
      tipX - headLength * Math.cos(angle + 0.52),
      tipY - headLength * Math.sin(angle + 0.52)
    );
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };

  arrows.forEach(({ f, t }) => renderArrow(f, t, false));
  if (rcFrom && previewTo && previewTo !== rcFrom) {
    renderArrow(rcFrom, previewTo, true);
  }
}

// ── Mod Calcul Toggle ────────────────────────────────────────────────────────
function toggleAnalysisMode(){
  if(gameMode === 'p2p') return;
  analysisMode = !analysisMode;
  if(analysisMode){
    G('bcalc').classList.add('on');
    setBadge('analysis','calc');
  } else {
    G('bcalc').classList.remove('on');
    updateStatus();
    if(chess.turn() !== playerColor) engineGo();
  }
}

// ── Focus Mode Toggle ────────────────────────────────────────────────────────
function applyFocusMode(active){
  focusMode = active;
  localStorage.setItem('bl_focus', focusMode ? '1' : '0');
  if(focusMode){
    document.body.classList.add('focus-mode');
    G('btn-focus').classList.add('on');
    G('btn-focus').textContent = '✕ Exit Focus';
  } else {
    document.body.classList.remove('focus-mode');
    G('btn-focus').classList.remove('on');
    G('btn-focus').textContent = '🎯 Focus Mode';
  }
  renderBoard();
  drawArrows();
}

G('btn-focus').addEventListener('click', () => applyFocusMode(!focusMode));
document.addEventListener('keydown', e => {
  if((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'INPUT'){
    applyFocusMode(!focusMode);
  }
});

// ── Navigation ────────────────────────────────────────────────────────────────
function goBack(){
  if(vi===-1){snap=chess.history({verbose:true});vi=snap.length}
  if(vi<=0) return;
  vi--; viewOnlyMode=true;
  showAt(vi); snd('Select');
}

function goFwd(){
  if(vi===-1||vi>=snap.length) return;
  vi++;
  if(vi===snap.length){returnToLive();return}
  showAt(vi); snd('Select');
}

function showAt(idx){
  const tmp=new Chess();
  for(let i=0;i<idx;i++){const m=snap[i];tmp.move({from:m.from,to:m.to,promotion:m.promotion||'q'})}
  lastFrom=idx>0?snap[idx-1].from:null;
  lastTo=idx>0?snap[idx-1].to:null;
  renderBoard(tmp);
  setBadge('move '+idx+'/'+snap.length,'wait');
  highlightViewMove(idx);
}

function returnToLive(){
  vi=-1; viewOnlyMode=false;
  lastFrom=snap.length>0?snap[snap.length-1].from:null;
  lastTo=snap.length>0?snap[snap.length-1].to:null;
  renderBoard();
  updateStatus();
  highlightViewMove(-1);
}

G('bwrap').addEventListener('click',e=>{
  if(viewOnlyMode&&e.target.classList.contains('sq')){
    const sq=e.target.dataset.sq||e.target.closest('[data-sq]')?.dataset.sq;
    if(!sq) return;
    chess=new Chess();
    for(let i=0;i<vi;i++){const m=snap[i];chess.move({from:m.from,to:m.to,promotion:m.promotion||'q'})}
    snap=chess.history({verbose:true}); vi=-1; viewOnlyMode=false;
    updateMoves();
    const p=chess.get(sq);
    if(p&&p.color===playerColor){selSq=sq;legal=chess.moves({square:sq,verbose:true}).map(m=>m.to);applySquareClasses()}
  }
});

function highlightViewMove(idx){
  G('mlist').querySelectorAll('.mrow').forEach(el=>el.classList.remove('view'));
  if(idx===-1) return;
  const rowIdx=Math.floor((idx-1)/2);
  const rows=G('mlist').querySelectorAll('.mrow');
  if(rows[rowIdx]) rows[rowIdx].classList.add('view');
}

// ── Status & UI ───────────────────────────────────────────────────────────────
function setBadge(txt,cls){
  G('badge').textContent=txt;
  G('badge').className='badge'+(cls?' '+cls:'');
}

function updateStatus(){
  if(chess.game_over()) return;
  if(gameMode === 'p2p'){
    if(chess.in_check()){ setBadge('check!','chk'); }
    else if(chess.turn()===playerColor){ setBadge('your move','go'); }
    else { setBadge('friend\x27s move','wait'); }
    const t=chess.turn();
    const tHost = isHost ? (t==='w') : (t==='b');
    G('bot-bar').className='pbar'+(tHost?' active':'');
    G('top-bar').className='pbar'+(!tHost?' active':'');
    return;
  }
  if(analysisMode){
    setBadge('analysis','calc');
    return;
  }
  if(chess.in_check()){setBadge('check!','chk')}
  else if(chess.turn()===playerColor){setBadge('your move','go')}
  else{setBadge('thinking…','wait')}
  const t=chess.turn(),tEng=playerColor==='w';
  G('top-bar').className='pbar'+((tEng?t==='b':t==='w')?' active':'');
  G('bot-bar').className='pbar'+((tEng?t==='w':t==='b')?' active':'');
}

function updateMoves(){
  const h=chess.history();
  if(!h.length){G('mlist').innerHTML='<div class="emp">— no moves yet —</div>';return}
  let html='';
  for(let i=0;i<h.length;i+=2){
    const n=Math.floor(i/2)+1;
    html+=`<div class="mrow${i>=h.length-2?' lat':''}"><span class="mn">${n}.</span><span class="mw">${h[i]||''}</span><span class="mb">${h[i+1]||''}</span></div>`;
  }
  const ml=G('mlist'); ml.innerHTML=html; ml.scrollTop=ml.scrollHeight;
}

// ── Game Over & Promotion ─────────────────────────────────────────────────────
function showOver(){
  stopClock();
  const won=chess.in_checkmate()&&chess.turn()!==playerColor;
  let icon,title,msg;
  if(chess.in_checkmate()){
    icon=won?'🏆':'😿';
    title=won?'You win!':'Checkmate';
    msg=won ? (gameMode==='p2p'?'You won the match! 😺':'You checkmated BLUERICA! 😺')
            : (gameMode==='p2p'?'You lost the match. 😼':'BLUERICA wins. 😼');
  }
  else if(chess.in_stalemate()){icon='🤝';title='Stalemate';msg='Draw!'}
  else{icon='½';title='Draw';msg='The game ended in a draw.'}

  G('mg').textContent=icon; G('mt').textContent=title; G('mm').textContent=msg;
  G('mnew').textContent = gameMode==='p2p' ? 'Request Rematch' : 'Play Again';
  G('ov').classList.add('show');
}

function showPromo(){
  const c=chess.turn();
  const row=G('prow'); row.innerHTML='';
  ['q','r','b','n'].forEach(t=>{
    const sq=document.createElement('div'); sq.className='psq';
    sq.innerHTML='<img src="'+getPieceUrl(c,t)+'" alt="'+t+'">';
    sq.addEventListener('click',()=>{
      G('pov').classList.remove('show');
      if(ppFrom){
        const mv=chess.move({from:ppFrom,to:ppTo,promotion:t});
        const fromSq=ppFrom, toSq=ppTo;
        ppFrom=null;ppTo=null;
        if(mv){
          lastFrom=mv.from;lastTo=mv.to;
          clearArrowsHL();
          renderBoard();
          snd('Move');
          updateStatus();updateMoves();
          startClockIfNeeded();

          if(gameMode === 'p2p' && p2pConn && p2pConn.open){
            p2pConn.send({ type: 'move', from: fromSq, to: toSq, promo: t });
          }

          if(!chess.game_over()){
            if(gameMode === 'bot' && !analysisMode) engineGo();
          } else {
            snd('GenericNotify');setTimeout(showOver,500);
          }
        }
      }
    });
    row.appendChild(sq);
  });
  G('pov').classList.add('show');
}

// ── Hint & Reactions ──────────────────────────────────────────────────────────
async function doHint(){
  if(gameMode==='p2p') return;
  if(!engineReady||engineBusy||viewOnlyMode) return;
  G('bhint').disabled=true; G('bhint').textContent='⏳';
  const best=await bestMove(chess.fen(), 3);
  G('bhint').disabled=false; G('bhint').textContent='💡 Hint';
  if(!best) return;
  const f=best.slice(0,2),t=best.slice(2,4);
  getSqEl(f)?.classList.add('ehi'); getSqEl(t)?.classList.add('ehi');
  setTimeout(()=>{getSqEl(f)?.classList.remove('ehi');getSqEl(t)?.classList.remove('ehi')},2000);
}

function spawnReaction(emoji){
  const el = document.createElement('div');
  el.className = 'toast-reaction';
  el.textContent = emoji;
  G('bwrap').appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ── New Game ──────────────────────────────────────────────────────────────────
function newGame(){
  stopClock();
  chess=new Chess(); snap=[]; vi=-1; viewOnlyMode=false;
  selSq=null; legal=[]; lastFrom=null; lastTo=null;
  pmFrom=null; pmTo=null; rcHL={}; arrows=[];
  engineBusy=false;
  if(analysisMode) toggleAnalysisMode();
  G('ov').classList.remove('show');
  setEval(0); updateMoves();

  if(selectedTC === 'none'){
    G('top-clock').style.display = 'none';
    G('bot-clock').style.display = 'none';
  } else {
    const sec = parseInt(selectedTC, 10);
    whiteTime = sec;
    blackTime = sec;
    G('top-clock').style.display = 'block';
    G('bot-clock').style.display = 'block';
    updateClockDisplays();
  }

  if(gameMode === 'p2p'){
    G('top-name').textContent = isHost ? 'Friend (Black)' : 'Friend (White)';
    G('bot-name').textContent = isHost ? 'You (White)' : 'You (Black)';
  } else {
    G('top-name').textContent=playerColor==='w'?'BLUERICA':'You';
    G('bot-name').textContent=playerColor==='w'?'You':'BLUERICA';
  }

  renderBoard();
  updateStatus();
  if(gameMode === 'bot' && playerColor==='b'){ startClockIfNeeded(); engineGo(); }
}

// ── P2P Multiplayer (WebRTC / PeerJS) ─────────────────────────────────────────
function setGameMode(mode){
  gameMode = mode;
  if(mode === 'p2p'){
    G('m-p2p').classList.add('on');
    G('m-bot').classList.remove('on');
    G('p2p-panel').style.display = 'block';
    G('panel-difficulty').style.display = 'none';
    G('panel-playas').style.display = 'none';
    G('bcalc').style.display = 'none';
    G('bhint').style.display = 'none';
    setBadge('p2p mode','p2p');
  } else {
    G('m-bot').classList.add('on');
    G('m-p2p').classList.remove('on');
    G('p2p-panel').style.display = 'none';
    G('panel-difficulty').style.display = 'block';
    G('panel-playas').style.display = 'block';
    G('bcalc').style.display = 'inline-block';
    G('bhint').style.display = 'inline-block';
    closeP2P();
    playerColor = G('bw').classList.contains('on') ? 'w' : 'b';
    newGame();
  }
}

function generateRoomId(){
  return 'roki-' + Math.random().toString(36).substring(2, 7);
}

function initP2PHost(){
  closeP2P();
  isHost = true;
  playerColor = 'w';
  p2pRoomId = generateRoomId();

  G('p2p-code-display').textContent = p2pRoomId;
  G('p2p-idle').style.display = 'none';
  G('p2p-active').style.display = 'flex';
  G('p2p-status-badge').textContent = '⏳ Waiting for friend…';

  const shareUrl = window.location.origin + window.location.pathname + '#room=' + p2pRoomId;
  G('p2p-wa-btn').href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent('Let\x27s play a game of chess! Join room: ' + shareUrl);

  peer = new Peer(p2pRoomId, { debug: 1 });

  peer.on('open', id => {
    setBadge('room open','p2p');
  });

  peer.on('connection', conn => {
    p2pConn = conn;
    setupConnectionHandlers();
    conn.on('open', () => {
      conn.send({ type: 'init', fen: chess.fen(), hostColor: 'w', tc: selectedTC });
      onPeerConnected();
    });
  });

  peer.on('error', err => {
    console.error('Peer error:', err);
    alert('Room connection error: ' + err.type);
    closeP2P();
  });

  newGame();
}

function joinP2PRoom(roomId){
  closeP2P();
  isHost = false;
  playerColor = 'b';
  p2pRoomId = roomId;

  setGameMode('p2p');
  G('p2p-code-display').textContent = p2pRoomId;
  G('p2p-idle').style.display = 'none';
  G('p2p-active').style.display = 'flex';
  G('p2p-status-badge').textContent = '⏳ Connecting to room…';

  peer = new Peer({ debug: 1 });

  peer.on('open', () => {
    const conn = peer.connect(roomId);
    p2pConn = conn;
    setupConnectionHandlers();
    conn.on('open', () => {
      onPeerConnected();
    });
  });

  peer.on('error', err => {
    console.error('Peer join error:', err);
    alert('Could not connect to room: ' + roomId);
    closeP2P();
  });

  newGame();
}

function setupConnectionHandlers(){
  if(!p2pConn) return;

  p2pConn.on('data', data => {
    if(!data) return;
    if(data.type === 'init'){
      if(data.tc !== undefined){
        selectedTC = data.tc;
        updateTCUI();
      }
      playerColor = data.hostColor === 'w' ? 'b' : 'w';
      newGame();
      onPeerConnected();
    } else if(data.type === 'move'){
      doRemoteMove(data.from, data.to, data.promo);
    } else if(data.type === 'reaction'){
      spawnReaction(data.emoji);
    } else if(data.type === 'timeout'){
      handleTimeout(data.loser);
    } else if(data.type === 'resign'){
      snd('GenericNotify');
      G('mg').textContent = '🏆';
      G('mt').textContent = 'You won!';
      G('mm').textContent = 'Your friend resigned.';
      G('ov').classList.add('show');
    } else if(data.type === 'rematch_req'){
      if(confirm('Your friend wants a rematch! Accept?')){
        p2pConn.send({ type: 'rematch_accept' });
        playerColor = playerColor === 'w' ? 'b' : 'w';
        newGame();
      }
    } else if(data.type === 'rematch_accept'){
      alert('Rematch accepted! Switching colors.');
      playerColor = playerColor === 'w' ? 'b' : 'w';
      newGame();
    }
  });

  p2pConn.on('close', () => {
    alert('Your friend disconnected.');
    G('p2p-status-badge').textContent = '⚠️ Friend disconnected';
    G('p2p-reactions').style.display = 'none';
  });
}

function onPeerConnected(){
  G('p2p-status-badge').textContent = '🟢 Friend connected!';
  G('p2p-reactions').style.display = 'flex';
  setBadge('game active','go');
  updateStatus();
}

function closeP2P(){
  if(p2pConn){ p2pConn.close(); p2pConn = null; }
  if(peer){ peer.destroy(); peer = null; }
  G('p2p-idle').style.display = 'block';
  G('p2p-active').style.display = 'none';
  G('p2p-reactions').style.display = 'none';
  window.location.hash = '';
}

}

document.querySelectorAll('[data-tc]').forEach(btn => {

  G('bb').classList.add('on');

G('ngame').addEventListener('click',newGame);

G('bbk').addEventListener('click',goBack);

// Window resize
window.addEventListener('resize',()=>{renderBoard();drawArrows()});

// Check if user arrived via invitation hash

  if(window.location.hash.startsWith('#room=')){
    const target = window.location.hash.replace('#room=','').trim();
    if(target) joinP2PRoom(target);
  }
});

// ── Boot ──────────────────────────────────────────────────────────────────────
initEngine();
newGame();
