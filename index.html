<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluerica Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111210;--surface:#1a1917;--surface2:#222120;
  --border:#2e2c28;--accent:#c8a45a;--accent-dim:rgba(200,164,90,0.12);
  --text:#e8e2d6;--muted:#7a7060;--green:#5ea87a;--red:#c95f5f;
  --ls:#f0d9b5;--ds:#b58863;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-weight:300;touch-action:manipulation}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:'Playfair Display',serif;font-size:1rem;color:var(--accent)}
.logo em{font-style:italic;color:var(--muted);font-size:.85em;margin-left:6px}
.badge{font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);letter-spacing:.08em;transition:all .3s}
.badge.go{border-color:var(--green);color:var(--green)}
.badge.wait{border-color:var(--accent);color:var(--accent)}
.badge.chk{border-color:var(--red);color:var(--red)}

main{display:flex;justify-content:center;align-items:flex-start;gap:20px;padding:16px;flex-wrap:wrap}

/* Board */
.board-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.pbar{display:flex;align-items:center;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;gap:8px}
.pbar.active{color:var(--text)}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--green);display:none;flex-shrink:0}
.pbar.active .tdot{display:block}

#bwrap{position:relative;touch-action:none}
#bwrap canvas.arrows{position:absolute;top:0;left:0;pointer-events:none;z-index:20}

/* Board squares rendered by JS */
#bwrap .board{display:grid;grid-template-columns:repeat(8,1fr);user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.ls{background:var(--ls)}
.sq.ds{background:var(--ds)}
.sq.sel{background:rgba(255,255,255,0.22)!important;box-shadow:inset 0 0 0 3px rgba(255,255,255,0.6)!important}
.sq.lmf{background:rgba(200,164,90,0.28)!important}
.sq.lmt{background:rgba(200,164,90,0.5)!important}
.sq.rch{background:rgba(200,50,50,0.5)!important}
.sq.pre{background:rgba(100,180,255,0.38)!important}
.sq.ehi{box-shadow:inset 0 0 0 4px rgba(100,200,100,0.9)!important}

/* Move hint dot */
.sq.dot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,0.22);pointer-events:none;z-index:5}
/* Capture hint ring */
.sq.ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:5px solid rgba(0,0,0,0.2);pointer-events:none;z-index:5}

/* Coord labels */
.coord-r{position:absolute;top:2px;left:3px;font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:500;pointer-events:none;z-index:2}
.coord-f{position:absolute;bottom:2px;right:3px;font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:500;pointer-events:none;z-index:2}
.sq.ls .coord-r,.sq.ls .coord-f{color:var(--ds)}
.sq.ds .coord-r,.sq.ds .coord-f{color:var(--ls)}

/* Piece image */
.sq img{width:88%;height:88%;pointer-events:none;position:relative;z-index:3}

/* Dragging ghost */
.drag-ghost{position:fixed;pointer-events:none;z-index:1000;transform:translate(-50%,-50%)}
.drag-ghost img{width:100%;height:100%}
.sq img.dragging{opacity:0}

/* Sidebar */
.side{width:240px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.ph{padding:9px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pb{padding:12px 14px}
.cat img{width:100%;display:block;filter:saturate(.9)}

.eval-row{display:flex;align-items:center;gap:8px}
.eval-bar{flex:1;height:4px;background:#111;border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.eval-fill{height:100%;background:var(--ls);border-radius:3px;transition:width .6s ease;width:50%}
.eval-n{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);min-width:30px;text-align:right}

.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.db{padding:7px 4px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.6rem;cursor:pointer;transition:all .15s;text-align:center}
.db:hover{border-color:var(--accent);color:var(--text)}
.db.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.ds2{display:block;font-size:.52rem;margin-top:2px;opacity:.5;font-family:'Inter',sans-serif}

.crow{display:flex;gap:8px}
.cb{flex:1;padding:9px 4px;border:1px solid var(--border);background:transparent;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.65rem;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted)}
.cb.wc{color:#d4c9a8}.cb.wc.on{border-color:#d4c9a8;background:rgba(212,201,168,.08);color:#e8dfc8}
.cb.bc.on{border-color:var(--text);color:var(--text);background:rgba(255,255,255,.04)}

.nbtn{width:100%;padding:10px;background:var(--accent);color:#111;border:none;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-weight:500;transition:background .15s}
.nbtn:hover{background:#d4b06a}

.arow{display:flex;gap:8px}
.abtn{flex:1;padding:8px 4px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.6rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.abtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.abtn:disabled{opacity:.25;cursor:not-allowed}
.hbtn:hover:not(:disabled){border-color:#7ec8a0;color:#7ec8a0}
.rbtn:hover:not(:disabled){border-color:var(--red);color:var(--red)}

.mlist{max-height:180px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.65rem}
.mlist::-webkit-scrollbar{width:3px}
.mlist::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mrow{display:grid;grid-template-columns:22px 1fr 1fr;gap:4px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.mn{color:var(--border)}.mw{color:var(--text)}.mb{color:var(--muted)}
.mrow.lat .mw,.mrow.lat .mb{color:var(--accent)}
.emp{color:var(--border);font-size:.58rem;padding:6px 0}
.mrow.view{background:rgba(200,164,90,.08)}

.eng-row{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted)}
.edot{width:5px;height:5px;border-radius:50%;background:var(--muted);transition:background .3s}
.edot.rdy{background:var(--green)}.edot.bsy{background:var(--accent);animation:bl .7s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}

.ov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.ov.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:32px 40px;text-align:center;max-width:280px;width:90%}
.mg{font-size:2.4rem;margin-bottom:10px}
.modal h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--accent);margin-bottom:8px}
.modal p{color:var(--muted);font-size:.8rem;line-height:1.6;margin-bottom:20px}

.pov{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);align-items:center;justify-content:center}
.pov.show{display:flex}
.pbox{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:18px 22px;text-align:center}
.pbox h3{font-family:'Playfair Display',serif;color:var(--accent);margin-bottom:12px}
.prow{display:flex;gap:8px}
.psq{width:60px;height:60px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.psq:hover{border-color:var(--accent);background:var(--accent-dim)}
.psq img{width:50px;height:50px}

@media(max-width:820px){
  main{flex-direction:column;align-items:center;padding:8px;gap:12px}
  .side{width:100%;max-width:500px}
}
</style>
</head>
<body>
<header>
  <div class="logo">BLUERICA <em>chess</em></div>
  <div class="badge" id="badge">loading…</div>
</header>
<main>
  <div class="board-col">
    <div class="pbar" id="top-bar"><span class="tdot"></span><span id="top-name">BLUERICA</span></div>
    <div id="bwrap"><div class="board" id="board"></div><canvas class="arrows" id="acanvas"></canvas></div>
    <div class="pbar active" id="bot-bar"><span class="tdot"></span><span id="bot-name">You</span></div>
  </div>
  <div class="side">
    <div class="eng-row"><div class="edot" id="edot"></div><span id="elabel">Loading…</span></div>
    <div class="panel cat"><img src="cat.jpg" alt="Bluerica"></div>
    <div class="panel"><div class="pb" style="padding:10px 14px"><div class="eval-row"><div class="eval-bar"><div class="eval-fill" id="efill"></div></div><div class="eval-n" id="enum">0.0</div></div></div></div>
    <div class="panel"><div class="ph">Difficulty</div><div class="pb"><div class="dgrid">
      <button class="db on" data-sk="0"  data-dp="1" data-dl="1400">1<span class="ds2">Newbie</span></button>
      <button class="db"    data-sk="1"  data-dp="1" data-dl="1100">2<span class="ds2">Beginner</span></button>
      <button class="db"    data-sk="3"  data-dp="2" data-dl="900">3<span class="ds2">Easy</span></button>
      <button class="db"    data-sk="5"  data-dp="3" data-dl="700">4<span class="ds2">Casual</span></button>
      <button class="db"    data-sk="8"  data-dp="5" data-dl="600">5<span class="ds2">Medium</span></button>
      <button class="db"    data-sk="11" data-dp="7" data-dl="500">6<span class="ds2">Club</span></button>
      <button class="db"    data-sk="14" data-dp="10" data-dl="400">7<span class="ds2">Hard</span></button>
      <button class="db"    data-sk="17" data-dp="13" data-dl="350">8<span class="ds2">Expert</span></button>
      <button class="db"    data-sk="20" data-dp="18" data-dl="280">∞<span class="ds2">Max</span></button>
    </div></div></div>
    <div class="panel"><div class="ph">Play as</div><div class="pb"><div class="crow">
      <button class="cb wc on" id="bw">⬜ White</button>
      <button class="cb bc"    id="bb">⬛ Black</button>
    </div></div></div>
    <button class="nbtn" id="ngame">New Game</button>
    <div class="arow">
      <button class="abtn" id="bbk">◀ Back</button>
      <button class="abtn" id="bfw">Forward ▶</button>
    </div>
    <div class="arow">
      <button class="abtn hbtn" id="bhint">💡 Hint</button>
      <button class="abtn rbtn" id="bres">🏳 Resign</button>
    </div>
    <div class="panel"><div class="ph">Move history</div><div class="pb" style="padding:6px 14px"><div class="mlist" id="mlist"><div class="emp">— no moves yet —</div></div></div></div>
  </div>
</main>

<div class="ov" id="ov"><div class="modal">
  <div class="mg" id="mg">♟</div>
  <h2 id="mt">Game Over</h2>
  <p id="mm"></p>
  <button class="nbtn" id="mnew" style="max-width:160px;margin:0 auto">Play Again</button>
</div></div>

<div class="pov" id="pov"><div class="pbox">
  <h3>Promote pawn</h3>
  <div class="prow" id="prow"></div>
</div></div>

<script>
const G = id => document.getElementById(id);
const PIECES = 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/';

// ── State ─────────────────────────────────────────────────────────────────────
let chess = new Chess();
let playerColor = 'w';
let sqSize = 0;
let engineReady = false, engineBusy = false;
let sf = null, sfResolve = null;
let skill = 0, depth = 1, delay = 1400;
let snap = [], vi = -1;          // history snapshot, view index
let selSq = null, legal = [];    // selected square, legal targets
let ppFrom = null, ppTo = null;  // pending promotion
let pmFrom = null, pmTo = null;  // premove
let rcFrom = null, rcDrag = false; // right-click
let rcHL = {}, arrows = [];
let dragFrom = null, ghost = null;
let viewOnlyMode = false;        // true when browsing history

// ── Sounds ────────────────────────────────────────────────────────────────────
const SND = {};
['Move','Capture','Select','GenericNotify'].forEach(n => {
  const a = new Audio('sounds/'+n+'.mp3'); a.preload='auto'; SND[n]=a;
});
function snd(n){const s=SND[n];if(!s)return;const c=s.cloneNode();c.volume=.7;c.play().catch(()=>{})}
const AC=window.AudioContext||window.webkitAudioContext; let ac=null;
function sndCheck(){
  if(!ac)ac=new AC(); if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime;
  [0,.12,.24].forEach((o,i)=>{
    const os=ac.createOscillator(),g=ac.createGain();
    os.connect(g);g.connect(ac.destination);
    os.type='sine';os.frequency.setValueAtTime(880-i*60,t+o);
    g.gain.setValueAtTime(.14,t+o);g.gain.exponentialRampToValueAtTime(.001,t+o+.1);
    os.start(t+o);os.stop(t+o+.1);
  });
}

// ── Engine ────────────────────────────────────────────────────────────────────
function initEngine(){
  try{
    const b=new Blob([`importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');`],{type:'application/javascript'});
    sf=new Worker(URL.createObjectURL(b));
    sf.onmessage=e=>{
      const m=e.data;
      if(m==='uciok'){sf.postMessage('isready');return}
      if(m==='readyok'){
        engineReady=true;G('edot').className='edot rdy';G('elabel').textContent='BLUERICA ready';
        setBadge('your move','go'); return;
      }
      if(m&&m.startsWith('bestmove')&&sfResolve){
        const mv=m.split(' ')[1],cb=sfResolve;sfResolve=null;cb(mv==='(none)'?null:mv);return;
      }
      if(m&&m.includes('score cp')){const r=m.match(/score cp (-?\d+)/);if(r)setEval(parseInt(r[1])/100)}
      if(m&&m.includes('score mate')){const r=m.match(/score mate (-?\d+)/);if(r)setEval(parseInt(r[1])>0?99:-99)}
    };
    sf.onerror=()=>G('elabel').textContent='Engine error';
    sf.postMessage('uci');
  }catch(e){G('elabel').textContent='Engine unavailable'}
}
function setEval(cp){
  const p=Math.min(Math.max(50+cp*3.5,4),96);
  G('efill').style.width=p+'%';
  G('enum').textContent=cp>=99?'+M':cp<=-99?'-M':(cp>=0?'+':'')+cp.toFixed(1);
}
async function bestMove(fen){
  return new Promise(r=>{
    sfResolve=r;
    sf.postMessage('setoption name Skill Level value '+skill);
    sf.postMessage('position fen '+fen);
    sf.postMessage('go depth '+depth);
  });
}

// ── Board rendering ───────────────────────────────────────────────────────────
function boardPx(){
  const max=window.innerWidth<=820?window.innerWidth-16:Math.min(window.innerWidth-290,580);
  return Math.floor(max/8)*8; // divisible by 8
}

function renderBoard(pos){
  // pos = chess object or fen string to render (default = chess)
  const brd=G('board');
  const flip=playerColor==='b';
  const sz=boardPx(); sqSize=sz/8;
  brd.style.width=sz+'px'; brd.style.height=sz+'px';
  brd.innerHTML='';

  const fenObj = pos ? new Chess(typeof pos==='string'?pos:pos.fen()) : chess;

  for(let ri=0;ri<8;ri++){
    for(let ci=0;ci<8;ci++){
      const row=flip?ri:7-ri, col=flip?7-ci:ci;
      const sq='abcdefgh'[col]+(row+1);
      const light=(row+col)%2===1;
      const div=document.createElement('div');
      div.className='sq '+(light?'ls':'ds');
      div.dataset.sq=sq;
      div.style.width=sqSize+'px'; div.style.height=sqSize+'px';

      // coords
      if(ci===0){const r=document.createElement('span');r.className='coord-r';r.textContent=row+1;div.appendChild(r)}
      if(ri===7){const f=document.createElement('span');f.className='coord-f';f.textContent='abcdefgh'[col];div.appendChild(f)}

      // piece
      const p=fenObj.get(sq);
      if(p){
        const img=document.createElement('img');
        img.src=PIECES+(p.color==='w'?'w':'b')+p.type.toUpperCase()+'.svg';
        img.draggable=false;
        div.appendChild(img);
      }

      div.addEventListener('mousedown',e=>onMouseDown(e,sq));
      div.addEventListener('touchstart',e=>onTouchStart(e,sq),{passive:false});
      brd.appendChild(div);
    }
  }

  // sync canvas
  const cv=G('acanvas');
  cv.width=sz; cv.height=sz;
  cv.style.width=sz+'px'; cv.style.height=sz+'px';

  applySquareClasses();
  drawArrows();
}

function getSqEl(sq){return G('board').querySelector('[data-sq="'+sq+'"]')}

function applySquareClasses(){
  // Clear all state classes
  G('board').querySelectorAll('.sq').forEach(el=>{
    el.classList.remove('sel','lmf','lmt','rch','pre','ehi','dot','ring');
  });
  // Selected
  if(selSq) getSqEl(selSq)?.classList.add('sel');
  // Legal hints
  legal.forEach(t=>{
    const el=getSqEl(t); if(!el) return;
    el.classList.add(chess.get(t)?'ring':'dot');
  });
  // Last move
  if(lastFrom) getSqEl(lastFrom)?.classList.add('lmf');
  if(lastTo)   getSqEl(lastTo)?.classList.add('lmt');
  // RC highlights
  Object.keys(rcHL).forEach(sq=>getSqEl(sq)?.classList.add('rch'));
  // Premove
  if(pmFrom){getSqEl(pmFrom)?.classList.add('pre');getSqEl(pmTo)?.classList.add('pre')}
}

let lastFrom=null, lastTo=null;

// ── Click / touch to move ────────────────────────────────────────────────────
function onMouseDown(e,sq){
  if(e.button===2) return; // handled by right-click
  e.preventDefault();
  clearArrowsHL();
  handleSelect(e.clientX, e.clientY, sq, true);
}

function onTouchStart(e,sq){
  e.preventDefault();
  const t=e.touches[0];
  clearArrowsHL();
  handleSelect(t.clientX, t.clientY, sq, false);
}

function handleSelect(cx,cy,sq,enableDrag){
  if(chess.game_over()) return;

  // If in view mode - click moves back to live
  if(viewOnlyMode){ returnToLive(); return; }

  // Engine thinking - set premove
  if(engineBusy||chess.turn()!==playerColor){
    if(selSq){
      const p=chess.get(selSq);
      if(p&&p.color===playerColor){
        setPremove(selSq,sq); clearSel(); return;
      }
    }
    const p=chess.get(sq);
    if(p&&p.color===playerColor){selSq=sq;legal=[];applySquareClasses();}
    return;
  }

  // If square selected
  if(selSq){
    if(sq===selSq){clearSel();return}
    if(legal.includes(sq)){
      doMove(selSq,sq); return;
    }
    const p=chess.get(sq);
    if(p&&p.color===playerColor){selSq=sq;legal=chess.moves({square:sq,verbose:true}).map(m=>m.to);applySquareClasses();return}
    clearSel(); return;
  }

  // Select own piece
  const p=chess.get(sq);
  if(p&&p.color===playerColor){
    selSq=sq; legal=chess.moves({square:sq,verbose:true}).map(m=>m.to);
    applySquareClasses();
    // Start drag
    if(enableDrag) startDrag(cx,cy,sq,p);
  }
}

function clearSel(){selSq=null;legal=[];applySquareClasses()}

function doMove(from,to,promo){
  // Promotion check
  const p=chess.get(from);
  if(p&&p.type==='p'){
    const r=to[1];
    if((playerColor==='w'&&r==='8')||(playerColor==='b'&&r==='1')){
      ppFrom=from;ppTo=to;clearSel();showPromo();return;
    }
  }
  const mv=chess.move({from,to,promotion:promo||'q'});
  if(!mv){clearSel();return}
  lastFrom=from;lastTo=to;
  clearSel();
  renderBoard();
  snd(mv.flags&&(mv.flags.includes('c')||mv.flags.includes('e'))?'Capture':'Move');
  if(chess.in_check())sndCheck();
  updateStatus();updateMoves();
  if(chess.game_over()){snd('GenericNotify');setTimeout(showOver,500);return}
  engineGo();
}

// ── Drag & drop ───────────────────────────────────────────────────────────────
function startDrag(cx,cy,sq,piece){
  const img=getSqEl(sq)?.querySelector('img');
  if(!img) return;
  img.classList.add('dragging');
  dragFrom=sq;

  ghost=document.createElement('div');
  ghost.className='drag-ghost';
  ghost.style.width=sqSize+'px'; ghost.style.height=sqSize+'px';
  ghost.innerHTML='<img src="'+PIECES+(piece.color==='w'?'w':'b')+piece.type.toUpperCase()+'.svg" draggable="false">';
  ghost.style.left=cx+'px'; ghost.style.top=cy+'px';
  document.body.appendChild(ghost);

  const onMove=e=>{
    const ex=e.touches?e.touches[0].clientX:e.clientX;
    const ey=e.touches?e.touches[0].clientY:e.clientY;
    ghost.style.left=ex+'px'; ghost.style.top=ey+'px';
  };
  const onUp=e=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.removeEventListener('touchend',onUp);
    ghost?.remove(); ghost=null;
    getSqEl(dragFrom)?.querySelector('img')?.classList.remove('dragging');

    const ex=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
    const ey=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
    const dropSq=sqFromXY(ex,ey);

    if(dropSq&&dropSq!==dragFrom&&legal.includes(dropSq)){
      doMove(dragFrom,dropSq);
    } else {
      // Snap back - re-show piece
      applySquareClasses();
    }
    dragFrom=null;
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('mouseup',onUp);
  document.addEventListener('touchend',onUp);
}

function sqFromXY(x,y){
  const brd=G('board').getBoundingClientRect();
  const px=x-brd.left, py=y-brd.top;
  const sz=brd.width/8;
  const col=Math.floor(px/sz), row=Math.floor(py/sz);
  if(col<0||col>7||row<0||row>7) return null;
  const flip=playerColor==='b';
  return 'abcdefgh'[flip?7-col:col]+(flip?row+1:8-row);
}

// ── Engine ────────────────────────────────────────────────────────────────────
async function engineGo(){
  if(!engineReady) return;
  engineBusy=true;
  setBadge('thinking…','wait'); G('edot').className='edot bsy';
  const best=await bestMove(chess.fen());
  await new Promise(r=>setTimeout(r,delay+Math.random()*300));
  engineBusy=false; G('edot').className='edot rdy';
  if(!best) return;
  const from=best.slice(0,2),to=best.slice(2,4);
  const mv=chess.move({from,to,promotion:best[4]||'q'});
  lastFrom=from;lastTo=to;
  renderBoard();
  snd(mv&&mv.flags&&(mv.flags.includes('c')||mv.flags.includes('e'))?'Capture':'Move');
  if(chess.in_check())sndCheck();
  updateStatus();updateMoves();
  if(chess.game_over()){snd('GenericNotify');setTimeout(showOver,500);return}
  // Execute premove
  if(pmFrom){
    const pf=pmFrom,pt=pmTo; clearPremove();
    setTimeout(()=>{
      if(chess.turn()===playerColor&&!chess.game_over()) doMove(pf,pt);
    },80);
  }
}

// ── Premove ───────────────────────────────────────────────────────────────────
function setPremove(from,to){
  clearPremove(); pmFrom=from; pmTo=to;
  applySquareClasses();
  setBadge('premove set','wait');
}
function clearPremove(){pmFrom=null;pmTo=null;applySquareClasses()}

// ── Right-click arrows ────────────────────────────────────────────────────────
G('bwrap').addEventListener('contextmenu',e=>e.preventDefault());
G('bwrap').addEventListener('mousedown',e=>{
  if(e.button!==2) return;
  e.preventDefault();
  rcFrom=sqFromXY(e.clientX,e.clientY); rcDrag=false;
});
document.addEventListener('mousemove',e=>{
  if(!(e.buttons&2)||!rcFrom) return;
  const sq=sqFromXY(e.clientX,e.clientY);
  if(sq&&sq!==rcFrom) rcDrag=true;
});
document.addEventListener('mouseup',e=>{
  if(e.button!==2||!rcFrom) return;
  e.preventDefault();
  const sq=sqFromXY(e.clientX,e.clientY);
  if(rcDrag&&sq&&sq!==rcFrom){
    const idx=arrows.findIndex(a=>a.f===rcFrom&&a.t===sq);
    if(idx!==-1) arrows.splice(idx,1); else arrows.push({f:rcFrom,t:sq});
    drawArrows();
  } else {
    if(rcHL[rcFrom]){delete rcHL[rcFrom];getSqEl(rcFrom)?.classList.remove('rch')}
    else{rcHL[rcFrom]=true;getSqEl(rcFrom)?.classList.add('rch')}
  }
  rcFrom=null; rcDrag=false;
});

function clearArrowsHL(){
  Object.keys(rcHL).forEach(sq=>getSqEl(sq)?.classList.remove('rch'));
  rcHL={}; arrows=[]; drawArrows();
}

function drawArrows(){
  const cv=G('acanvas'),ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const sz=sqSize;
  arrows.forEach(({f,t})=>{
    const fc=center(f),tc=center(t);
    const dx=tc.x-fc.x,dy=tc.y-fc.y,len=Math.sqrt(dx*dx+dy*dy);
    const ux=dx/len,uy=dy/len,hl=sz*.42,lw=sz*.13;
    ctx.save();
    ctx.strokeStyle='rgba(200,50,50,.88)'; ctx.fillStyle='rgba(200,50,50,.88)';
    ctx.lineWidth=lw; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(fc.x,fc.y);
    ctx.lineTo(tc.x-ux*hl*.7,tc.y-uy*hl*.7); ctx.stroke();
    const a=Math.atan2(dy,dx),sp=.42;
    ctx.beginPath();
    ctx.moveTo(tc.x,tc.y);
    ctx.lineTo(tc.x-hl*Math.cos(a-sp),tc.y-hl*Math.sin(a-sp));
    ctx.lineTo(tc.x-hl*Math.cos(a+sp),tc.y-hl*Math.sin(a+sp));
    ctx.closePath(); ctx.fill(); ctx.restore();
  });
}

function center(sq){
  const flip=playerColor==='b';
  const col='abcdefgh'.indexOf(sq[0]),row=parseInt(sq[1])-1;
  const c=flip?7-col:col,r=flip?row:7-row;
  return{x:c*sqSize+sqSize/2,y:(7-r)*sqSize+sqSize/2};
}

// ── Navigation: back / forward with branching ─────────────────────────────────
function goBack(){
  if(vi===-1){snap=chess.history({verbose:true});vi=snap.length}
  if(vi<=0) return;
  vi--; viewOnlyMode=true;
  showAt(vi); snd('Select');
}

function goFwd(){
  if(vi===-1||vi>=snap.length) return;
  vi++;
  if(vi===snap.length){returnToLive();return}
  showAt(vi); snd('Select');
}

function showAt(idx){
  const tmp=new Chess();
  for(let i=0;i<idx;i++){const m=snap[i];tmp.move({from:m.from,to:m.to,promotion:m.promotion||'q'})}
  lastFrom=idx>0?snap[idx-1].from:null;
  lastTo=idx>0?snap[idx-1].to:null;
  renderBoard(tmp);
  setBadge('move '+idx+'/'+snap.length,'wait');
  highlightViewMove(idx);
}

function returnToLive(){
  vi=-1; viewOnlyMode=false;
  lastFrom=snap.length>0?snap[snap.length-1].from:null;
  lastTo=snap.length>0?snap[snap.length-1].to:null;
  renderBoard();
  updateStatus();
  highlightViewMove(-1);
}

// When in view mode, user can click a move in history to jump there
// AND continue playing from that position (branching)
G('bwrap').addEventListener('click',e=>{
  if(viewOnlyMode&&e.target.classList.contains('sq')){
    // clicking board in view mode starts new branch
    const sq=e.target.dataset.sq||e.target.closest('[data-sq]')?.dataset.sq;
    if(!sq) return;
    // Branch: set chess to position at vi, then handle click
    chess=new Chess();
    for(let i=0;i<vi;i++){const m=snap[i];chess.move({from:m.from,to:m.to,promotion:m.promotion||'q'})}
    snap=chess.history({verbose:true}); vi=-1; viewOnlyMode=false;
    updateMoves();
    const p=chess.get(sq);
    if(p&&p.color===playerColor){selSq=sq;legal=chess.moves({square:sq,verbose:true}).map(m=>m.to);applySquareClasses()}
  }
});

function highlightViewMove(idx){
  G('mlist').querySelectorAll('.mrow').forEach((el,i)=>{
    const moveIdx=i*2; // rough
    el.classList.remove('view');
  });
  // highlight current move pair
  if(idx===-1) return;
  const rowIdx=Math.floor((idx-1)/2);
  const rows=G('mlist').querySelectorAll('.mrow');
  if(rows[rowIdx]) rows[rowIdx].classList.add('view');
}

// ── Status & UI ───────────────────────────────────────────────────────────────
function setBadge(txt,cls){
  G('badge').textContent=txt;
  G('badge').className='badge'+(cls?' '+cls:'');
}

function updateStatus(){
  if(chess.game_over()) return;
  if(chess.in_check()){setBadge('check!','chk')}
  else if(chess.turn()===playerColor){setBadge('your move','go')}
  else{setBadge('thinking…','wait')}
  const t=chess.turn(),tEng=playerColor==='w';
  G('top-bar').className='pbar'+((tEng?t==='b':t==='w')?' active':'');
  G('bot-bar').className='pbar'+((tEng?t==='w':t==='b')?' active':'');
}

function updateMoves(){
  const h=chess.history();
  if(!h.length){G('mlist').innerHTML='<div class="emp">— no moves yet —</div>';return}
  let html='';
  for(let i=0;i<h.length;i+=2){
    const n=Math.floor(i/2)+1;
    html+=`<div class="mrow${i>=h.length-2?' lat':''}"><span class="mn">${n}.</span><span class="mw">${h[i]||''}</span><span class="mb">${h[i+1]||''}</span></div>`;
  }
  const ml=G('mlist'); ml.innerHTML=html; ml.scrollTop=ml.scrollHeight;
}

// ── Game over / promo ─────────────────────────────────────────────────────────
function showOver(){
  const won=chess.in_checkmate()&&chess.turn()!==playerColor;
  let icon,title,msg;
  if(chess.in_checkmate()){icon=won?'🏆':'😿';title=won?'You win!':'Checkmate';msg=won?'You checkmated BLUERICA! 😺':'BLUERICA wins. 😼'}
  else if(chess.in_stalemate()){icon='🤝';title='Stalemate';msg='Draw!'}
  else{icon='½';title='Draw';msg='The game ended in a draw.'}
  G('mg').textContent=icon; G('mt').textContent=title; G('mm').textContent=msg;
  G('ov').classList.add('show');
}

function showPromo(){
  const c=playerColor,row=G('prow'); row.innerHTML='';
  ['Q','R','B','N'].forEach(t=>{
    const sq=document.createElement('div'); sq.className='psq';
    sq.innerHTML='<img src="'+PIECES+c+t+'.svg" alt="'+t+'">';
    sq.addEventListener('click',()=>{
      G('pov').classList.remove('show');
      if(ppFrom){const mv=chess.move({from:ppFrom,to:ppTo,promotion:t.toLowerCase()});ppFrom=null;ppTo=null;if(mv){lastFrom=mv.from;lastTo=mv.to;renderBoard();snd('Move');updateStatus();updateMoves();if(!chess.game_over())engineGo();else{snd('GenericNotify');setTimeout(showOver,500)}}}
    });
    row.appendChild(sq);
  });
  G('pov').classList.add('show');
}

// ── Hint ──────────────────────────────────────────────────────────────────────
async function doHint(){
  if(!engineReady||engineBusy||viewOnlyMode||chess.turn()!==playerColor) return;
  G('bhint').disabled=true; G('bhint').textContent='⏳';
  const best=await bestMove(chess.fen());
  G('bhint').disabled=false; G('bhint').textContent='💡 Hint';
  if(!best) return;
  const f=best.slice(0,2),t=best.slice(2,4);
  getSqEl(f)?.classList.add('ehi'); getSqEl(t)?.classList.add('ehi');
  setTimeout(()=>{getSqEl(f)?.classList.remove('ehi');getSqEl(t)?.classList.remove('ehi')},2000);
}

// ── New game ──────────────────────────────────────────────────────────────────
function newGame(){
  chess=new Chess(); snap=[]; vi=-1; viewOnlyMode=false;
  selSq=null; legal=[]; lastFrom=null; lastTo=null;
  pmFrom=null; pmTo=null; rcHL={}; arrows=[];
  engineBusy=false;
  G('ov').classList.remove('show');
  setEval(0); updateMoves();
  G('top-name').textContent=playerColor==='w'?'BLUERICA':'You';
  G('bot-name').textContent=playerColor==='w'?'You':'BLUERICA';
  renderBoard();
  updateStatus();
  if(playerColor==='b') engineGo();
}

// ── Controls ──────────────────────────────────────────────────────────────────
// Restore saved level
(function(){
  const s=localStorage.getItem('bl');
  if(s){
    const b=document.querySelector('.db[data-sk="'+s+'"]');
    if(b){document.querySelectorAll('.db').forEach(x=>x.classList.remove('on'));b.classList.add('on');skill=+b.dataset.sk;depth=+b.dataset.dp;delay=+b.dataset.dl}
  }
})();

document.querySelectorAll('.db').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.db').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); skill=+b.dataset.sk; depth=+b.dataset.dp; delay=+b.dataset.dl;
  localStorage.setItem('bl',b.dataset.sk);
}));

G('bw').addEventListener('click',()=>{G('bw').classList.add('on');G('bb').classList.remove('on');playerColor='w';newGame()});
G('bb').addEventListener('click',()=>{G('bb').classList.add('on');G('bw').classList.remove('on');playerColor='b';newGame()});
G('ngame').addEventListener('click',newGame);
G('mnew').addEventListener('click',newGame);
G('bbk').addEventListener('click',goBack);
G('bfw').addEventListener('click',goFwd);
G('bhint').addEventListener('click',doHint);
G('bres').addEventListener('click',()=>{
  if(chess.game_over()||!confirm('Resign?')) return;
  snd('GenericNotify');G('mg').textContent='🏳';G('mt').textContent='You resigned';G('mm').textContent='BLUERICA wins. 😼';G('ov').classList.add('show');
});

// Resize
window.addEventListener('resize',()=>{renderBoard();drawArrows()});

// ── Boot ──────────────────────────────────────────────────────────────────────
initEngine();
newGame();
</script>
